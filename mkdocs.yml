site_name: hex-arena
site_url: https://hex-arena-cunef.readthedocs.io/es/latest/
site_description: Motor de Hex en Python, plataforma de bots y torneo automático.
repo_url: https://github.com/monianzola/HEX
repo_name: monianzola/HEX
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 hex-arena contributors · Licencia MIT

theme:
  name: material
  language: es
  icon:
    logo: material/hexagon-multiple
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: blue
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

nav:
  - Inicio: index.md
  - Reglas de Hex: reglas.md
  - Instalación: instalacion.md
  - "Tutorial: sube tu primer bot": tutorial-bot.md
  - Referencia del API:
      - Juego: api/game.md
      - Bots: api/bots.md
  - Torneo y clasificación: torneo.md
  - Contribuir: contribuir.md

plugins:
  - search:
      lang: es
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
